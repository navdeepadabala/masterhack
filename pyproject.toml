[project]
name = "argus"
version = "0.1.0"
description = "Argus — synthetic defensive payment-fraud research system (the Argus Cycle: Scout→Forge→Gatekeeper→Wraith→Sentinel→Ledger→Oracle)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34", "openai>=1.40", "google-generativeai>=0.8"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true